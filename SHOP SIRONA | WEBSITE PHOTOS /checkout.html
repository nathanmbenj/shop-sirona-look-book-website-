<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - SHOP SIRONA</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Stripe.js -->
    <script src="https://js.stripe.com/v3/"></script>
    <!-- PayPal SDK -->
    <script src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&currency=USD"></script>
</head>

<body>
    <header>
        <div class="header-content">
            <div>
                <h1><a href="index.html" style="text-decoration: none; color: inherit;">SHOP SIRONA FESTIVAL OUTFITS</a></h1>
            </div>
            <div class="cart-icon-container">
                <a href="index.html" class="back-link">← Back to Shop</a>
            </div>
        </div>
    </header>

    <main class="checkout-container">
        <div class="checkout-content">
            <div class="checkout-summary">
                <h2>Order Summary</h2>
                <div id="checkoutItems"></div>
                <div class="checkout-total">
                    <strong>Total: $<span id="checkoutTotal">0.00</span></strong>
                </div>
            </div>

            <div class="checkout-form">
                <h2>Shipping Information</h2>
                <form id="checkoutForm">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" name="city" required>
                        </div>
                        <div class="form-group">
                            <label for="state">State/Province</label>
                            <input type="text" id="state" name="state" required>
                        </div>
                        <div class="form-group">
                            <label for="zip">ZIP/Postal Code</label>
                            <input type="text" id="zip" name="zip" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="country">Country</label>
                        <select id="country" name="country" required>
                            <option value="">Select Country</option>
                            <option value="US">United States</option>
                            <option value="CA">Canada</option>
                            <option value="GB">United Kingdom</option>
                            <option value="AU">Australia</option>
                            <option value="DE">Germany</option>
                            <option value="FR">France</option>
                            <option value="IT">Italy</option>
                            <option value="ES">Spain</option>
                            <option value="NL">Netherlands</option>
                            <option value="BE">Belgium</option>
                            <option value="CH">Switzerland</option>
                            <option value="AT">Austria</option>
                            <option value="SE">Sweden</option>
                            <option value="NO">Norway</option>
                            <option value="DK">Denmark</option>
                            <option value="FI">Finland</option>
                            <option value="IE">Ireland</option>
                            <option value="PT">Portugal</option>
                            <option value="PL">Poland</option>
                            <option value="CZ">Czech Republic</option>
                            <option value="GR">Greece</option>
                            <option value="JP">Japan</option>
                            <option value="KR">South Korea</option>
                            <option value="CN">China</option>
                            <option value="IN">India</option>
                            <option value="BR">Brazil</option>
                            <option value="MX">Mexico</option>
                            <option value="AR">Argentina</option>
                            <option value="NZ">New Zealand</option>
                            <option value="SG">Singapore</option>
                            <option value="MY">Malaysia</option>
                            <option value="TH">Thailand</option>
                            <option value="PH">Philippines</option>
                            <option value="ID">Indonesia</option>
                            <option value="VN">Vietnam</option>
                            <option value="AE">United Arab Emirates</option>
                            <option value="SA">Saudi Arabia</option>
                            <option value="ZA">South Africa</option>
                            <option value="EG">Egypt</option>
                            <option value="IL">Israel</option>
                            <option value="TR">Turkey</option>
                            <option value="RU">Russia</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>
                </form>

                <div class="payment-methods">
                    <h2>Payment Method</h2>
                    
                    <!-- Stripe Payment -->
                    <div class="payment-option">
                        <h3>Pay with Card (Stripe)</h3>
                        <div id="stripe-payment">
                            <div id="card-element">
                                <!-- Stripe Elements will create form elements here -->
                            </div>
                            <div id="card-errors" role="alert"></div>
                            <button type="button" class="payment-btn stripe-btn" id="stripeBtn">
                                Pay with Card
                            </button>
                        </div>
                    </div>

                    <!-- PayPal Payment -->
                    <div class="payment-option">
                        <h3>Pay with PayPal</h3>
                        <div id="paypal-button-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2025 Sirona Festival Outfits. All rights reserved.</p>
    </footer>

    <script src="cart.js"></script>
    <script src="checkout.js"></script>
</body>

</html>
